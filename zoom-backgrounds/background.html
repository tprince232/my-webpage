<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI One — Zoom background</title>
<style>
  /* Canvas is a fixed 1920x1080 stage. Everything is authored at 1:1 so the
     headless-Chromium screenshot in render.sh is pixel-exact. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070d; }

  .stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--base);
    font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* --- themes ------------------------------------------------------------ */
  .stage[data-variant="midnight"] {
    --base: #05070d;
    --glow: rgba(87, 137, 255, .30);
    --glow-2: rgba(87, 137, 255, .13);
    --rule: rgba(87, 137, 255, .55);
    --ink: rgba(255, 255, 255, .60);
    --ghost: .055;
    --vignette: rgba(0, 0, 0, .45);
  }
  .stage[data-variant="light"] {
    --base: #f4f6fc;
    --glow: rgba(87, 137, 255, .26);
    --glow-2: rgba(87, 137, 255, .12);
    --rule: rgba(87, 137, 255, .8);
    --ink: rgba(11, 20, 48, .55);
    --ghost: .07;
    --vignette: rgba(11, 20, 48, .07);
  }
  .stage[data-variant="blue"] {
    --base: #0c1744;
    --glow: rgba(87, 137, 255, .60);
    --glow-2: rgba(120, 92, 255, .25);
    --rule: rgba(255, 255, 255, .55);
    --ink: rgba(255, 255, 255, .62);
    --ghost: .09;
    --vignette: rgba(4, 8, 30, .45);
  }

  /* --- layers ------------------------------------------------------------ */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(58% 70% at 6% 96%,  var(--glow)   0%, transparent 62%),
      radial-gradient(50% 60% at 96% 12%, var(--glow-2) 0%, transparent 65%);
  }


  /* Oversized brand mark, bled off the right edge, clear of the centre where
     the speaker sits. */
  .ghost {
    position: absolute;
    top: 50%;
    right: -330px;
    width: 900px;
    height: 900px;
    transform: translateY(-50%);
    opacity: var(--ghost);
  }
  .ghost img { width: 100%; height: 100%; display: block; }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(78% 86% at 50% 48%, transparent 45%, var(--vignette) 100%);
  }

  /* --- content ----------------------------------------------------------- */
  .lockup {
    position: absolute;
    top: 96px;
    left: 120px;
    height: 96px;
  }
  .lockup img { height: 100%; width: auto; display: block; }

  .tagline {
    position: absolute;
    top: 222px;
    left: 122px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 19px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .tagline::before {
    content: "";
    width: 46px;
    height: 2px;
    background: var(--rule);
  }

</style>
</head>
<body>
  <div class="stage" id="stage" data-variant="midnight">
    <div class="glow"></div>
    <div class="ghost"><img id="ghost-img" alt=""></div>
    <div class="vignette"></div>

    <div class="lockup"><img id="lockup-img" alt="AI One"></div>
  </div>

<script>
  // ?variant=midnight|light|blue   ?tagline=...   ?logo=lockup|mark
  var q = new URLSearchParams(location.search);
  var variant = q.get('variant') || 'midnight';
  var stage = document.getElementById('stage');
  stage.dataset.variant = variant;
  // Match the document background to the theme so the capture is edge-to-edge.
  document.documentElement.style.background =
    getComputedStyle(stage).getPropertyValue('--base');

  // Black logo art on the light background, white art on the dark ones.
  var ink = (variant === 'light') ? 'black' : 'white';
  document.getElementById('lockup-img').src = 'logo/ai-one-' + (q.get('logo') === 'mark' ? 'mark' : 'lockup') + '-' + ink + '.svg';
  document.getElementById('ghost-img').src = 'logo/ai-one-mark-' + (variant === 'light' ? 'blue' : (variant === 'blue' ? 'white' : 'blue')) + '.svg';

  // Optional supporting line under the lockup, e.g. ?tagline=Artificial%20Intelligence
  var tagline = q.get('tagline');
  if (tagline) {
    var el = document.createElement('div');
    el.className = 'tagline';
    el.textContent = tagline;
    stage.appendChild(el);
  }
</script>
</body>
</html>
